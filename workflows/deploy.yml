name: WFA Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: macos-latest
            goarch: arm64
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Verify dependencies
      run: go mod tidy

    - name: Run Unit Tests
      run: go test -v ./... -cover -race

    - name: Build for ${{ matrix.goarch }}
      env:
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: go build -v -o ./bin/api-${{ matrix.goarch }} ./cmd/api

    - name: Lint Code
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image (multi-arch)
      uses: docker/build-push-action@v4
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: false
        tags: wfa-meetup-api:latest
        file: ./Dockerfile